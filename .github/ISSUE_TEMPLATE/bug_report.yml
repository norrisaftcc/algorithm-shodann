name: Bug Report
description: Report something that isn't working correctly
title: "[BUG] "
labels: ["type: bug", "status: needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        ## Bug Report
        Help us identify and fix issues in SHODANN. Please provide as much detail as possible.

  - type: dropdown
    id: component
    attributes:
      label: Component Affected
      description: Which part of SHODANN is experiencing the issue?
      options:
        - Core Workflow (GitHub Actions)
        - Velocity Calculation Engine
        - RAGE STATE (Security Mode)
        - Persona/Voice System
        - State Management
        - Templates
        - Documentation
        - Other/Unknown
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
      placeholder: Describe the expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: Describe what went wrong
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Go to...
        2. Click on...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Where did this occur?
      placeholder: |
        - Workflow run ID (if applicable):
        - Repository:
        - Branch:
        - Commit SHA:
        - Date/time:
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Screenshots/Logs
      description: Add any error messages, logs, or screenshots
      placeholder: Paste error messages or drag images here
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: Impact Severity
      description: How severe is this issue?
      options:
        - Critical - Blocks all functionality
        - High - Major feature broken
        - Medium - Feature partially broken
        - Low - Minor issue or cosmetic
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other relevant information
    validations:
      required: false
