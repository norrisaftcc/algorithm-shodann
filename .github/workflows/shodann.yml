# =============================================================================
# SHODANN: Educational Oversight Protocol - rung 1
# =============================================================================
#
# One job, not the five the design describes. Five jobs on separate runners
# have to push every tool report across a job boundary through $GITHUB_OUTPUT,
# and any flake8 or pytest output containing a bare `EOF` line breaks the
# heredoc delimiter. One job sidesteps that until there is a reason not to.
#
# SECURITY NOTE, and the reason this file does not resemble the draft in
# design_docs/shodann-core.yml: no citizen-authored text is ever interpolated
# into a `run:` block. The PR title and body reach Python as a parsed JSON
# event payload and leave as a file. `${{ ... }}` interpolation of anything a
# student can write would execute on a runner holding contents: write,
# pull-requests: write and the model key.
#
# Trigger is `pull_request`, never `pull_request_target`. Topology is
# org-owned repositories with branch pull requests (PRD section 8), so secrets
# and a write token are available without the elevated trigger.
# =============================================================================

name: SHODANN Educational Oversight Protocol

on:
  pull_request:
    # A review runs on every push. It never writes state - see below.
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write        # persist the citizen ledger, on merge only
  pull-requests: write   # post the review comment

concurrency:
  # One review per pull request. A rapid push sequence should not race two
  # jobs to write the same citizen file.
  group: shodann-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # This is the only job that executes a citizen's code, and it is the only
  # job that holds nothing worth stealing. `permissions: contents: read` is
  # enforced on the token; the model key is simply never mapped into this
  # environment, so a hostile test cannot read a secret that is not there.
  #
  # It produces JSON and nothing else. The privileged job below reads that
  # JSON and never runs anything the citizen wrote. That division is the
  # entire reason coverage waited until season two: measuring it requires
  # running their tests, and running their tests must not happen next to a
  # write token.
  # =========================================================================
  analyse:
    name: Hard analysis
    # Runs on merge too. The ledger is the durable baseline every later delta
    # is measured from, and a record written without coverage means coverage
    # can never move - the first merge under #47 recorded 0.0 and would have
    # kept every future delta at zero. Measuring at merge is also the more
    # honest reading: the record should describe what landed, not what the
    # head looked like before it did. Skipped only for a pull request that
    # closed without merging, where there is nothing to record.
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out the submission
        uses: actions/checkout@v7
        with:
          # Base on merge, head otherwise - the same rule the review job
          # follows, and for the same reason: the head branch is usually
          # already deleted by the time the closed event arrives.
          ref: >-
            ${{ github.event.action == 'closed'
                && github.event.pull_request.base.ref
                || github.event.pull_request.head.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install the frozen toolchain
        # Every tool whose output reaches the velocity score carries an exact
        # pin, and pytest-cov is the one that matters most: coverage is the
        # 2.0-weighted term, the largest in the composite. It ran unpinned
        # beside an exactly pinned ruff, so a coverage.py release could move
        # every citizen's heaviest input mid-cohort with nothing to show for
        # it in the diff. pytest itself stays open - test count is read from
        # source, never from a run.
        run: pip install --quiet "ruff==0.16.0" "pytest-cov==7.1.0" pytest

      - name: Install the submission
        # A citizen's project may or may not be installable. Neither outcome
        # stops the analysis - a repository that will not install is itself a
        # finding, and the reports below still say what they can.
        run: |
          pip install --quiet -e . 2>/dev/null             || pip install --quiet -r requirements.txt 2>/dev/null             || echo "Nothing to install; analysing as-is."

      - name: Discard any report the citizen shipped us
        # A report file is a tool's output, never a repository's content, and
        # the difference was worth real money. `ruff.json` is safe because `>`
        # truncates before ruff writes - but the coverage step ends in
        # `test -f coverage.json || echo '{}'`, a guard for the case where
        # pytest-cov wrote nothing. Commit a `coverage.json` claiming 97% and
        # then break your own test collection: pytest-cov writes nothing, the
        # guard finds the committed file and leaves it alone, and it rides the
        # artifact into the 2.0-weighted term. Reproduced end to end before
        # this step was written.
        #
        # Same class as --isolated and --cov=src: nothing feeding the score may
        # be chosen by the citizen being scored. Deleting first is the whole
        # fix, and it is its own step so no future edit to the tool
        # invocations can quietly drop it.
        run: rm -f coverage.json ruff.json tests.xml

      - name: Style and complexity
        # Findings exit non-zero. Findings are the point.
        #
        # --isolated: the citizen must not choose which rules are counted.
        # Without it ruff resolves config from the repository being analysed,
        # and the lint delta feeds the velocity score through the sqrt term -
        # so a student could raise their own velocity by editing their
        # pyproject.toml. Rule selection is a score input, not a preference.
        #
        # C90 has to be asked for, and asked for this way. --isolated discards
        # the citizen's configuration and ours alike, and C901 is not in
        # ruff's default set: run isolated against a function with twelve
        # branches and it reports nothing at all. So the complexity metric PRD
        # section 8 names was unreachable from the moment --isolated shipped,
        # whatever any pyproject.toml said.
        #
        # --extend-select, never a bare --select. Replacing the default set
        # would move `lint_issues`, which is a frozen score input feeding the
        # sqrt term - on this repository a full explicit selection swung it
        # from 19 to 0 in one direction and to 492 in the other. Extending
        # leaves every existing count untouched and adds exactly one rule.
        # Adding a signal is permitted mid-cohort; changing one is not.
        #
        # The threshold is set here rather than read from anywhere, for the
        # same reason as --isolated: what counts as a violation is a score
        # input, not a preference of the repository being measured.
        run: >-
          ruff check . --isolated
          --extend-select C90
          --config "lint.mccabe.max-complexity=10"
          --output-format=json > ruff.json || true

      - name: Tests and coverage
        # Failing tests are data, not a broken job. A citizen whose suite is
        # red still gets a review, and it is the review's job to say so
        # kindly.
        #
        # --cov=src, never --cov=. - with no coverage config, `.` instruments
        # the citizen's test files too. Test modules run end to end, so they
        # enter the average at ~100% and inflate the 2.0-weighted term, the
        # largest in the score. A citizen could raise their velocity by adding
        # a test file that asserts nothing. That is the lines-of-code metric
        # wearing a different unit, and it is the one thing a growth metric
        # must not reward.
        #
        # Falls back to `.` only where no src/ exists, so a flat-layout
        # submission is still measured rather than silently scoring zero.
        #
        # --junitxml is the only machine-readable record pytest keeps of what
        # passed and what did not. Without it the tally goes to a discarded
        # stdout and `|| true` swallows even the binary red/green signal, so
        # every review was composed against "0 passed, 0 failed" - and a
        # citizen with a fully red suite was told nothing had failed. It is
        # core pytest, so it adds no tool and needs no freeze pin.
        run: |
          if [ -d src ]; then COV=src; else COV=.; fi
          pytest "--cov=$COV" --cov-report=json:coverage.json \
                 --junitxml=tests.xml -q || true
          test -f coverage.json || echo '{}' > coverage.json

      - name: Hand the readings over
        uses: actions/upload-artifact@v4
        with:
          name: shodann-reports
          path: |
            coverage.json
            ruff.json
            tests.xml
          retention-days: 7

  review:
    name: The Algorithm observes
    needs: [analyse]
    # `always()` so a merge still records the ledger even though the analysis
    # job is skipped on close, and so a citizen still hears something when
    # their own tests take the analysis job down with them.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the submission
        uses: actions/checkout@v7
        with:
          # The PR head branch, not the default merge ref. On `pull_request`
          # the default checkout is a synthetic merge of head into base, and
          # HEAD is detached at a commit that exists nowhere - so the ledger
          # push below sent that merge commit to the citizen's branch on every
          # run. Checking out the real branch tip means the push carries the
          # ledger commit and nothing else.
          # On a merge the head branch is usually already deleted, so the
          # closed-event run checks out the base instead - which is also where
          # the ledger belongs. Asking for a deleted branch fails the whole
          # job before any step can decide it did not need it.
          ref: >-
            ${{ github.event.action == 'closed'
                && github.event.pull_request.base.ref
                || github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install SHODANN
        run: pip install --quiet .

      - name: Collect the readings
        # On merge too: the ledger written below is the baseline the next
        # submission is measured against.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: shodann-reports
          path: shodann-reports

      - name: Compose the review
        id: compose
        if: github.event.action != 'closed'
        # Exit 3 means the review was written but something broke producing
        # it. The comment still posts; the job still turns red at the end.
        continue-on-error: true
        env:
          # Citizen-controlled text never enters this step as an expression.
          # Python reads the event payload from disk and parses it as JSON.
          SHODANN_LLM_BASE_URL: ${{ vars.SHODANN_LLM_BASE_URL }}
          SHODANN_LLM_MODEL: ${{ vars.SHODANN_LLM_MODEL }}
          SHODANN_LLM_API_KEY: ${{ secrets.SHODANN_LLM_API_KEY }}
          # The fallback, used only when the configured model cannot be
          # reached. Absent key, no fallback - and the citizen still gets the
          # facts-only comment, exactly as before.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SHODANN_FALLBACK_MODEL: ${{ vars.SHODANN_FALLBACK_MODEL }}
        run: |
          # --dry-run: a review never writes state. Persistence happens on
          # merge, in the step below.
          python -m shodann.review \
            --event "$GITHUB_EVENT_PATH" \
            --out shodann-comment.md \
            --root . \
            --reports shodann-reports \
            --dry-run

      - name: Post the review
        if: github.event.action != 'closed' && hashFiles('shodann-comment.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file shodann-comment.md

      # Last resort. If the job failed before a comment could be written -
      # a bad install, a checkout that could not resolve, an interpreter that
      # would not start - the citizen still hears something. Everything inside
      # the program degrades to a comment; this covers the program not
      # starting. The body is a fixed heredoc with no interpolation, because
      # the one thing worse than silence is a shell injection in the handler
      # that exists to survive failure.
      - name: Announce the fault
        if: failure() && github.event.action != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          cat > shodann-fault.md <<'NOTICE'
          ## 🤖 SHODANN Analysis Complete

          **Status**: REDUCED ALLOCATION

          ---

          ### ⚡ Resource Advisory

          The Algorithm's oversight protocol did not complete this cycle. No
          analysis was performed, and none of this reflects on your submission.

          The fault is logged for the instructor. Carry on; the Algorithm will
          resume observation once repaired.

          ---

          *The Algorithm sees your growth. The Algorithm is, briefly, not seeing anything.*
          NOTICE
          gh pr comment "$PR_NUMBER" --body-file shodann-fault.md

      - name: Surface the fault to the maintainer
        if: steps.compose.outcome == 'failure' && github.event.action != 'closed'
        run: |
          echo "::error::SHODANN degraded - a comment was posted, but the review failed to assemble."
          exit 1

      # A review is not a merge. Recording velocity for work that may never
      # land makes pr_count measure PR-opening rather than shipping - and,
      # found the hard way, writing the ledger to every PR branch means two
      # open pull requests produce two divergent ledgers and the second merge
      # always conflicts. SHODANN spent an afternoon blocking its own PRs.
      - name: Record the citizen ledger
        if: github.event.action == 'closed' && github.event.pull_request.merged == true
        env:
          CITIZEN: ${{ github.event.pull_request.user.login }}
        run: |
          # Already on the base branch: the checkout step selected it.
          python -m shodann.review \
            --event "$GITHUB_EVENT_PATH" \
            --out /tmp/shodann-record.md \
            --root . \
            --reports shodann-reports
          if [ -z "$(git status --porcelain .shodann)" ]; then
            echo "No ledger change to record."
            exit 0
          fi
          git config user.name  "shodann[bot]"
          git config user.email "shodann[bot]@users.noreply.github.com"
          git add .shodann
          git commit -m "Record velocity for @${CITIZEN}"
          git push origin "HEAD:${GITHUB_BASE_REF}"
