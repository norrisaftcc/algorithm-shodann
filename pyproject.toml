[project]
name = "shodann"
version = "0.1.0"
description = "The Algorithm's benevolent educational oversight system"
requires-python = ">=3.11"
# `anthropic` is the fallback provider's client, not a second way to reach the
# primary one. Anthropic's Messages API is not OpenAI-compatible - different
# body, different response shape, `x-api-key` rather than a bearer token, and a
# `refusal` stop reason with no counterpart - so the alternative was
# hand-rolling all of that in urllib beside the wire that already works.
#
# Deliberately not pinned. The freeze in PRD section 8 covers tools whose
# output feeds the velocity score; this one produces prose that the validator
# checks and the groundedness probe re-checks against the facts. A client
# release cannot move a citizen's baseline.
dependencies = ["jinja2>=3.1", "anthropic>=0.40"]

[project.optional-dependencies]
# Exact pins are for tools whose output feeds the velocity score. A routine
# reinstall must not move a citizen's baseline, so bumping one of these is a
# deliberate act that ends a cohort's frozen window; see PRD section 8.
#
#   ruff        pinned - diagnostic counts feed the lint term, and C901 is the
#               complexity metric. Its numbers move between releases.
#   pytest-cov  pinned - coverage is the 2.0-weighted term, the largest in the
#               composite. It was unpinned in CI and missing here entirely,
#               while the lighter input beside it was pinned exactly.
#   pytest      not pinned - nothing a citizen is measured on comes from it.
#               Test count is read from source, never from a run.
dev = ["pytest>=8", "pytest-cov==7.1.0", "ruff==0.16.0"]

[project.scripts]
shodann-velocity = "shodann.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# C901 is the complexity metric SHODANN reports to students; see PRD section 8.
# It replaces radon, and its numbers are frozen for cohort 1.
select = ["E", "W", "F", "C90", "I", "UP", "B", "S"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
